name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-auth:
    name: auth-service (fmt, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artagoal-backend/services/auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: gofmt check
        run: test -z "$(gofmt -l internal pkg cmd migrations)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...

  backend-goal:
    name: goal-service (fmt, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artagoal-backend/services/goal-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: gofmt check
        run: test -z "$(gofmt -l internal pkg cmd migrations)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...

  frontend:
    name: frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artagoal-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: artagoal-frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: lint
        run: npm run lint
      - name: test
        run: npm test
      - name: build
        run: npm run build
